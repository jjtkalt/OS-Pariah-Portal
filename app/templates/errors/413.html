{% extends 'base.html' %}
{% block title %}Upload too large - {{ grid_name }} Portal{% endblock %}

{% block content %}
<div class="text-center mb-20">
    <h1 class="text-primary m-0">Upload too large</h1>
    <p class="text-muted mt-10">The file you tried to upload exceeds the size limit. Please choose a smaller file and try again.</p>
    <p class="mt-10"><a href="{{ url_for('index') }}" class="btn btn-outline">Back to Home</a></p>
</div>
{% endblock %}
