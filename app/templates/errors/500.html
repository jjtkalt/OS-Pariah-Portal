{% extends 'base.html' %}
{% block title %}Something went wrong - {{ grid_name }} Portal{% endblock %}

{% block content %}
<div class="text-center mb-20">
    <h1 class="text-primary m-0">Something went wrong</h1>
    <p class="text-muted mt-10">The portal hit an unexpected error. Please try again; if it keeps happening, open a Helpdesk ticket.</p>
    <p class="mt-10"><a href="{{ url_for('index') }}" class="btn btn-outline">Back to Home</a></p>
</div>
{% endblock %}
