name: Automated Tests

# Tell GitHub WHEN to run this script
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# Least-privilege default token: clone + dependency cache only (no packages/issues/PR writes).
permissions:
  contents: read
  actions: write # setup-python pip cache restore/save via actions/cache

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        # Pin to match .pre-commit-config.yaml rev and requirements-dev.txt.
        run: python -m pip install "ruff==0.17.6"

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Ruff format check
        run: ruff format --check .

  test:
    # Tell GitHub WHAT kind of temporary server to spin up
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code onto the temporary server
      - name: Checkout Code
        uses: actions/checkout@v7

      # 2. Install Python 3.13
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip # Speeds up future runs!

      # 3. Install your app's dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-dev.txt

      # 4. Run the Phase 0 Safety Net!
      # Includes tests/test_packaging_units.py (systemd unit / sudoers / spec invariants;
      # no MariaDB service required — the suite mocks the database).
      - name: Run Pytest
        run: pytest -v tests/

  migrate:
    # Apply all SQL migrations against a real MariaDB (catches syntax / fail-closed exit).
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: os_pariah
          MYSQL_USER: os-pariah
          MYSQL_PASSWORD: Par1ahT3st
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt

      - name: Run migrations
        env:
          OS_PARIAH_DB_HOST: 127.0.0.1
          OS_PARIAH_DB_USER: os-pariah
          OS_PARIAH_DB_PASS: Par1ahT3st
          OS_PARIAH_DB_NAME: os_pariah
          SECRET_KEY: ci-migrate-test-secret-not-for-production
        run: |
          # ensure_secret_key may write .secrets; SECRET_KEY is already set for CI.
          python scripts/migrate.py
