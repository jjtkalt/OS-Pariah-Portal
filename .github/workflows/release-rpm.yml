name: openSUSE RPM Build

on:
  release:
    types: [published]

# Checkout + attach RPM to the published release (GitHub maps release asset uploads to contents: write).
permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    # Avoid job-level `container:` (Leap image pulls have been flaky) and avoid
    # third-party actions: this repo allows GitHub-owned actions only.

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require release commit on main
        env:
          TARGET: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          if [ "$TARGET" = "develop" ]; then
            echo "::error::Releases must be created from main (got target_commitish=develop)."
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release commit ${GITHUB_SHA} is not on main. Tag and publish releases from main only."
            exit 1
          fi
          echo "OK: release commit is on main (target_commitish=${TARGET})"

      - name: Build and sign RPM in openSUSE container
        env:
          TAG: ${{ github.event.release.tag_name }}
          BUILD_NUMBER: ${{ github.run_number }}
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASS: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          APP_VERSION="${TAG#v}"
          echo "Building version: $APP_VERSION"
          mkdir -p artifacts

          docker run --rm \
            -e "APP_VERSION=${APP_VERSION}" \
            -e "BUILD_NUMBER=${BUILD_NUMBER}" \
            -e GPG_KEY \
            -e GPG_PASS \
            -v "$PWD:/workspace:ro" \
            -v "$PWD/artifacts:/out" \
            registry.opensuse.org/opensuse/leap:16.0 \
            bash -lc '
              set -euo pipefail
              zypper refresh
              zypper install -y tar gzip rsync rpm-build rpmdevtools sed gpg2

              rpmdev-setuptree
              mkdir -p /tmp/os-pariah-portal-$APP_VERSION
              rsync -a --exclude=".git" --exclude=".github" /workspace/ /tmp/os-pariah-portal-$APP_VERSION/

              printf "%s\n" \
                "\"\"\"" \
                "Single source of truth for the portal version at runtime." \
                "" \
                "This file is auto-generated during RPM builds from the GitHub Release tag." \
                "\"\"\"" \
                "" \
                "__version__ = \"$APP_VERSION\"" \
                > /tmp/os-pariah-portal-$APP_VERSION/app/version.py

              tar -czvf "$HOME/rpmbuild/SOURCES/os-pariah-portal-$APP_VERSION.tar.gz" \
                -C /tmp "os-pariah-portal-$APP_VERSION"

              cp /tmp/os-pariah-portal-$APP_VERSION/packaging/os-pariah.spec "$HOME/rpmbuild/SPECS/"
              sed -i "s/^Version:.*/Version: $APP_VERSION/" "$HOME/rpmbuild/SPECS/os-pariah.spec"

              rpmbuild -ba --define "build_number $BUILD_NUMBER" "$HOME/rpmbuild/SPECS/os-pariah.spec"

              mkdir -p ~/.gnupg
              chmod 700 ~/.gnupg
              echo "use-agent" > ~/.gnupg/gpg.conf
              echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
              echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf
              gpg-agent --daemon

              echo "$GPG_KEY" | gpg --batch --yes --import
              KEY_ID=$(gpg --list-keys --with-colons | awk -F: "/^pub:/ { print \$5; exit }")

              echo "%_signature gpg" > ~/.rpmmacros
              echo "%_gpg_name $KEY_ID" >> ~/.rpmmacros
              echo "%__gpg_sign_cmd %{__gpg} --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase $GPG_PASS -u %{_gpg_name} -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}" >> ~/.rpmmacros

              rpmsign --addsign "$HOME/rpmbuild/RPMS/x86_64/"*.rpm
              cp "$HOME/rpmbuild/RPMS/x86_64/"os-pariah-portal-*.rpm /out/
            '

      - name: Attach RPM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/os-pariah-portal-*.rpm)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No RPM artifacts found under artifacts/"
            ls -la artifacts || true
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
