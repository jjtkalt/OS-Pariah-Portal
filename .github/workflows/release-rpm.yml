name: openSUSE RPM Build

on:
  release:
    types: [published]

# Checkout + attach RPM to the published release (GitHub maps release asset uploads to contents: write).
permissions:
  contents: write

jobs:
  # Do not build or publish an RPM for a commit that has not passed Automated Tests
  # (.github/workflows/ci-tests.yml, which runs on push to main/develop and on PRs).
  ci-gate:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require successful Automated Tests for release SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Poll for up to ~30 minutes in case CI for the tagged commit is still running.
          for attempt in $(seq 1 60); do
            runs=$(gh api "repos/${REPO}/actions/workflows/ci-tests.yml/runs?head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]')
            if [ "$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')" -gt 0 ]; then
              echo "OK: Automated Tests succeeded for ${SHA}"
              exit 0
            fi
            if [ "$(echo "$runs" | jq 'length')" -gt 0 ] && \
               [ "$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')" -eq 0 ]; then
              echo "::error::Automated Tests completed for ${SHA} but none succeeded."
              echo "$runs"
              exit 1
            fi
            echo "Waiting for Automated Tests on ${SHA} (attempt ${attempt}/60)..."
            sleep 30
          done
          echo "::error::Timed out waiting for a successful Automated Tests run on ${SHA}."
          exit 1

  build-rpm:
    needs: ci-gate
    runs-on: ubuntu-latest
    # Native openSUSE tooling for rpmbuild; requires softprops/action-gh-release
    # on the repo Actions allowlist (GitHub-owned actions alone are not enough).
    container:
      image: opensuse/leap:16.0

    steps:
    # 1. OpenSUSE minimal containers don't come with git or tar, so we install them first
    - name: Install Prerequisites & RPM Tools
      run: |
        zypper refresh
        zypper install -y git tar gzip rsync rpm-build rpmdevtools sed

    # 2. Checkout the code (full history so we can verify the tag is on main).
    - name: Checkout Code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    # 3. Stable releases must come from main (develop is integration-only).
    - name: Require release commit on main
      env:
        TARGET: ${{ github.event.release.target_commitish }}
      run: |
        set -euo pipefail
        if [ "$TARGET" = "develop" ]; then
          echo "::error::Releases must be created from main (got target_commitish=develop)."
          exit 1
        fi
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor HEAD origin/main; then
          echo "::error::Release commit ${GITHUB_SHA} is not on main. Tag and publish releases from main only."
          exit 1
        fi
        echo "OK: release commit is on main (target_commitish=${TARGET})"

    # 4. Setup the build tree, extract version, and pack the tarball
    - name: Prepare RPM Environment
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        # Grab the GitHub Release Tag and strip the "v" prefix (should be in the vx.x.x format)
        if ! printf '%s' "$TAG" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+([.+~-][0-9A-Za-z.+~-]*)?$'; then
          echo "::error::Release tag '$TAG' is not a valid version (expected vX.Y.Z)."
          exit 1
        fi
        APP_VERSION="${TAG#v}"

        echo "Building version: $APP_VERSION"

        rpmdev-setuptree
        mkdir -p /tmp/os-pariah-$APP_VERSION
        rsync -a --exclude='.git' --exclude='.github' ./ /tmp/os-pariah-$APP_VERSION/

        # Write the runtime version into the source tree so the portal can display it
        printf '%s\n' \
          '"""' \
          'Single source of truth for the portal version at runtime.' \
          '' \
          'This file is auto-generated during RPM builds from the GitHub Release tag.' \
          '"""' \
          '' \
          "__version__ = \"$APP_VERSION\"" \
          > /tmp/os-pariah-$APP_VERSION/app/version.py

        tar -czvf $HOME/rpmbuild/SOURCES/os-pariah-$APP_VERSION.tar.gz -C /tmp os-pariah-$APP_VERSION

        # Copy the spec file and dynamically update the Version line
        cp packaging/os-pariah.spec $HOME/rpmbuild/SPECS/
        sed -i "s/^Version:.*/Version: $APP_VERSION/" $HOME/rpmbuild/SPECS/os-pariah.spec

    # 5. Compile the RPM natively on openSUSE!
    - name: Compile the RPM
      env:
        BUILD_NUMBER: ${{ github.run_number }}
      run: rpmbuild -ba --define "build_number ${BUILD_NUMBER}" $HOME/rpmbuild/SPECS/os-pariah.spec

    # 6. Sign the RPM using our injected GPG Key
    - name: Sign the RPM
      env:
        GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        GPG_PASS: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        # 1. GPG is extremely paranoid about permissions. Set them explicitly.
        mkdir -p ~/.gnupg
        chmod 700 ~/.gnupg

        # 2. Force GPG to run headless without trying to pop up a password window
        echo "use-agent" > ~/.gnupg/gpg.conf
        echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
        echo "allow-loopback-pinentry" > ~/.gnupg/gpg-agent.conf

        # 3. Explicitly boot the agent in the background so the IPC socket is ready
        gpg-agent --daemon

        # 4. Import the key to the container using batch mode
        echo "$GPG_KEY" | gpg --batch --yes --import

        # 5. Get the key ID we just imported
        KEY_ID=$(gpg --list-keys --with-colons | awk -F: '/^pub:/ { print $5; exit }')

        # 6. Configure RPM to use this key and a non-interactive passphrase loopback
        echo "%_signature gpg" > ~/.rpmmacros
        echo "%_gpg_name $KEY_ID" >> ~/.rpmmacros

        # Tell RPM exactly how to call GPG silently
        echo "%__gpg_sign_cmd %{__gpg} --batch --no-verbose --no-armor --pinentry-mode loopback --passphrase $GPG_PASS -u %{_gpg_name} -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}" >> ~/.rpmmacros

        # 7. Sign the package!
        rpmsign --addsign $HOME/rpmbuild/RPMS/x86_64/*.rpm

    # 7. Attach the finished .rpm file to your GitHub Release
    - name: Attach RPM to GitHub Release
      uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
      with:
        files: /github/home/rpmbuild/RPMS/x86_64/os-pariah-*.rpm
