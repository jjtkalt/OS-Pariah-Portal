# OS-Pariah nginx vhost (installed as /etc/nginx/vhosts.d/os-pariah.conf).
## Cloudflare real-IP trust (PlatformStandards §6) lives in
# /etc/nginx/conf.d/os-pariah-cloudflare-ip.conf. openSUSE's nginx.conf already globs
# conf.d/*.conf at http{} level, so do NOT include it again here (duplicate
# set_real_ip_from / real_ip_header directives would be loaded twice).

server {
    listen 80;
    listen [::]:80;
    server_name portal.example.com;

    return 301 https://portal.example.com$request_uri;
}

map $request_uri $limit_key {
    # Exclude image review
    ~*^/admin/texture/  "";
    # Default to the client's IP address
    default             $binary_remote_addr;
}

# A rate limiter for Portal to avoid DDOS attacks
limit_req_zone $limit_key zone=os_pariah_limit:10m rate=5r/s;

server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    server_name portal.example.com;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Honor Cloudflare's forwarded scheme, falling back to the origin scheme (PlatformStandards §6).
    set $forwarded_proto $http_x_forwarded_proto;
    if ($forwarded_proto = "") {
        set $forwarded_proto $scheme;
    }

    # Use Dummy certs until certbot is setup
    ssl_certificate /etc/nginx/dummy-os-pariah.crt; # Replace with real certs
    ssl_certificate_key /etc/nginx/dummy-os-pariah.key; # Replace with real certs
    #ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem; # managed by Certbot
    #ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem; # managed by Certbot

    #    Allow TLS 1.2 and 1.3 only; older protocol versions are disabled, in line
    #    with current information security recommendations.
    ssl_protocols        TLSv1.2 TLSv1.3;

    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  60m;

    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    # Limit payload size for ticket attachments (e.g., 10MB)
    client_max_body_size 10M;

    # Return 429 (not the default 503) when limit_req rejects a request.
    limit_req_status 429;

    # Branded static error pages shipped with the portal (app/static/errors/).
    error_page 404 /static/errors/404.html;
    error_page 429 /static/errors/50x.html;
    error_page 500 502 503 504 /static/errors/50x.html;
    location ^~ /static/errors/ {
        alias /opt/os-pariah/app/static/errors/;
        # add_header in a location replaces server-level headers, so repeat them.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store" always;
    }

    # Static user manual (snapshot of templates/manual.html without Jinja).
    location = /manual.html {
        alias /opt/os-pariah/app/static/manual.html;
        default_type text/html;
        expires 1h;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ /\.(?!well-known) {
    deny all;
    }
    # Root shortcut icon: the portal redirects to the configured portal_favicon
    location = /favicon.ico {
      log_not_found off;
      access_log off;

      proxy_pass http://unix:/run/os-pariah/os-pariah.sock;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # Never trust client-supplied forwarding headers the app does not set itself.
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Prefix "";
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
    location = /robots.txt {
      allow all;
      log_not_found off;
      access_log off;
    }

    # Serve Static Files Directly (Bypasses Python completely for max speed)
    location /static/ {
        alias /opt/os-pariah/app/static/;
        expires 30d;
        # add_header in a location replaces server-level headers, so repeat them.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, no-transform" always;
    }

    # Main Proxy Pass to Gunicorn
    location / {
        limit_req zone=os_pariah_limit burst=20 nodelay;
        proxy_pass http://unix:/run/os-pariah/os-pariah.sock;

        # CRITICAL HEADERS: Pass the real client IP to Python
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Never trust client-supplied forwarding headers the app does not set itself.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Give the portal time if Robust is responding slowly
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # WebXML API (OpenSim Regions fetching config)
    location /regions/api/ {
        allow 192.168.1.1;      # Public IP of the Region Host
        allow 127.0.0.1;        # Localhost
        deny all;

        proxy_pass http://unix:/run/os-pariah/os-pariah.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Never trust client-supplied forwarding headers the app does not set itself.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
    }

    # Calendar feeds (short public cache)
    location ~ ^/events/feed\.(ics|rss)$ {
        proxy_pass http://unix:/run/os-pariah/os-pariah.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Never trust client-supplied forwarding headers the app does not set itself.
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        expires 5m;
        # add_header in a location replaces server-level headers, so repeat them.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "public, max-age=300" always;
    }
}